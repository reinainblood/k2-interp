[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "k2-interp"
version = "0.1.0"
description = "Reproducible interpretability experiments across IFM K2 Horizon checkpoints"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{name = "Kirsten Ruge"}]
dependencies = [
  "torch==2.13.0",
  "transformers==5.13.0",
  "accelerate>=1.10,<2",
  "safetensors>=0.6,<1",
  "huggingface-hub>=1.0,<2",
  "pydantic>=2.11,<3",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
modal = ["modal==1.5.5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "ruff>=0.12", "httpx>=0.28", "build>=1.2"]

[project.scripts]
k2-interp = "k2_interp.cli:main"

[project.urls]
Repository = "https://github.com/reinainblood/k2-interp"

[tool.hatch.build.targets.wheel]
packages = ["src/k2_interp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hub: downloads pinned model source only", "gpu: requires the full model and eight GPUs"]
